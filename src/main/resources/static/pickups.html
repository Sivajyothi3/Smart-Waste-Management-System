<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pickup Schedule</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
    }

    /* ✅ Navbar Styling */
    nav {
      background-color: #004d40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #ffd54f;
    }

    header {
      background-color: #00695c;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
    }

    main {
      padding: 30px;
    }

    h2 {
      text-align: center;
      color: #004d40;
    }

    .pickup-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .pickup-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .pickup-card:hover {
      transform: translateY(-5px);
    }

    .pickup-card h3 {
      color: #00695c;
    }

    .pickup-card p {
      margin: 5px 0;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #004d40;
      color: white;
      font-size: 14px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <!-- ✅ Navigation Bar -->
  <nav>
    <div class="logo">♻️ Smart Waste System</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="bins.html">Bins</a></li>
      <li><a href="pickups.html" style="color:#ffd54f;">Pickups</a></li>
      <li><a href="feedback.html">Feedback</a></li>
      <li><a href="report.html">Report Waste</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header>🚛 Scheduled Pickups</header>

  <!-- Main Content -->
  <main>
    <h2>Bins Scheduled for Pickup</h2>
    <div class="pickup-list" id="pickupContainer">Loading...</div>
  </main>
   <footer>© 2025 Smart Waste Management | Designed by Siva Jyothi 💚</footer>
  <script>
    const API_BASE_URL = "http://localhost:8080/api";

    async function loadPickups() {
      const container = document.getElementById("pickupContainer");
      try {
        const response = await fetch(`${API_BASE_URL}/bins`);
        const bins = await response.json();
        const fullBins = bins.filter(b => b.fillLevel >= 70);
        container.innerHTML = "";

        if (fullBins.length === 0) {
          container.innerHTML = "<p style='text-align:center;'>No bins require pickup now.</p>";
          return;
        }

        fullBins.forEach(bin => {
          const card = document.createElement("div");
          card.className = "pickup-card";
          card.innerHTML = `
            <h3>${bin.location}</h3>
            <p><b>City:</b> ${bin.city}</p>
            <p><b>District:</b> ${bin.district}</p>
            <p><b>State:</b> ${bin.state}</p>
            <p><b>Fill Level:</b> ${bin.fillLevel}%</p>
            <p style="color:red;"><b>Status:</b> Full</p>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        container.innerHTML = "<p style='color:red;'>Error loading data.</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", loadPickups);
  </script>
</body>
</html>
