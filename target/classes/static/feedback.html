<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Feedback</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
    }

    /* ✅ Navbar */
    nav {
      background-color: #004d40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #ffd54f;
    }

    header {
      background-color: #00695c;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .feedback-form {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }

    .feedback-form h2 {
      text-align: center;
      color: #004d40;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #004d40;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: "Poppins", sans-serif;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    button {
      background-color: #00695c;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:hover {
      background-color: #004d40;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #004d40;
      color: white;
      font-size: 14px;
      margin-top: 30px;
    }

    .success-message {
      text-align: center;
      color: green;
      font-weight: 500;
    }

    .error-message {
      text-align: center;
      color: red;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- ✅ Navbar -->
  <nav>
    <div class="logo">♻️ Smart Waste System</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="bins.html">Bins</a></li>
      <li><a href="pickups.html">Pickups</a></li>
      <li><a href="feedback.html" style="color:#ffd54f;">Feedback</a></li>
      <li><a href="report.html">Report Waste</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header>💬 Feedback</header>

  <!-- Main Form -->
  <main>
    <form class="feedback-form" id="feedbackForm">
      <h2>We value your feedback</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" placeholder="Share your thoughts..." required></textarea>

      <button type="submit">Send Feedback</button>

      <p class="success-message" id="successMsg" style="display:none;">✅ Feedback submitted successfully!</p>
      <p class="error-message" id="errorMsg" style="display:none;">❌ Failed to send feedback.</p>
    </form>
  </main>

   <footer>© 2025 Smart Waste Management | Designed by Siva Jyothi 💚</footer>

  <script>
    const API_BASE_URL = "http://localhost:8080/api";

    document.getElementById("feedbackForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      try {
        const response = await fetch(`${API_BASE_URL}/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          document.getElementById("successMsg").style.display = "block";
          document.getElementById("errorMsg").style.display = "none";
          document.getElementById("feedbackForm").reset();
        } else {
          document.getElementById("errorMsg").style.display = "block";
          document.getElementById("successMsg").style.display = "none";
        }
      } catch (error) {
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("successMsg").style.display = "none";
      }
    });
  </script>
</body>
</html>
